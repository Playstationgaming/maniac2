<style>

.hb{display:flex;gap:8px;align-items:center}.hb .btn{white-space:nowrap}
.btn.g{background:transparent;color:var(--fg);border:1px solid var(--fg)}
a.btn{text-decoration:none;display:inline-block}a.chip{text-decoration:none;display:inline-block}
.cartN{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:#e11d2e;color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:4px}
@media(max-width:760px){header{flex-wrap:wrap}.srch{order:5;flex:1 1 100%}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}

.nb{display:none!important}.addb{width:100%;flex:none}.addb small{white-space:normal}

<body>
<header>
  <a class="logo" href="#" title="Home" style="color:inherit;text-decoration:none;cursor:pointer" onclick="location.hash='';route();window.scrollTo(0,0);return false">ManiacPrints</a>
  <nav><a href="#products" id="nP" hidden>Shop</a><a href="#custom" id="nC" hidden>Customize</a></nav>
  <input class="srch" id="q" type="search" placeholder="Search tees" aria-label="Search tees">
  <div class="hb"><a class="btn sm g" href="#cart" id="cartB">Cart<span class="cartN" id="cartN" hidden>0</span></a><a class="btn sm g" href="#orders" id="ordB">My orders</a><button class="btn sm" id="authBtn" type="button">Log in</button></div>
</header>

<main id="shop">
  <div class="hero" id="hero">
    <div class="slides" id="slides"></div>
    <div class="hcopy"><h1 class="display" id="hh">Wear your own design</h1><p id="hp">Upload a PNG. We print it on a premium tee.</p>
      <div class="row" id="heroRow" hidden><button class="btn w" onclick="location.hash='#custom'">Customize</button><button class="btn w" onclick="location.hash='#products'">Shop</button></div></div>
    <button class="arr l" id="hPrev" aria-label="Previous photo">&#8249;</button><button class="arr r" id="hNext" aria-label="Next photo">&#8250;</button>
    <div class="dots" id="dots"></div>
  </div>
  <section id="prodSec" hidden>
    <div class="sh"><h2 id="fresh">Fresh drops</h2><div class="cb"><button id="cPrev" aria-label="Scroll left">&#8249;</button><button id="cNext" aria-label="Scroll right">&#8250;</button></div></div>
    <div class="car" id="feat"></div>
  </section>
  <section id="shopSec" hidden>
    <div class="sh"><h2 id="products">Shop all</h2><div class="chips" id="chips"></div></div>
    <div class="pgrid" id="pg"></div>
  </section>
  <section id="customSec" hidden>
    <a class="back" href="#products">&#8249; Back to shop</a>
    <h2 class="display" id="ptitle" style="font-size:40px">Design your tee</h2>
    <div class="cust">
      <div class="stage"><canvas id="shirt" width="768" height="1152"></canvas></div>
      <div>
        <label>1 · Choose a product</label><div class="pick" id="pick"></div><label>Shirt colour</label><div class="shirtc" id="shirtc"><button type="button" class="chip on" data-s="black"><i style="background:#111"></i>Black</button><button type="button" class="chip" data-s="white"><i style="background:#fff"></i>White</button></div><div class="step" id="stepPic"><label>2 · Add a picture <span class="mut">(optional)</span></label>
          <button type="button" class="addb" id="addP"><b>+</b>Add picture<small>PNG with see-through background</small></button>
          <button type="button" class="lnk" id="skipP" style="margin:10px 0 0">No picture? Skip, text only ↓</button>
          <div id="picEd" style="margin-top:12px"></div></div>
        <div class="step" id="stepText"><label>3 · Add your text</label>
          <div id="layers" class="layers"></div>
          <div id="editor"></div><input type="file" id="file" accept="image/png" hidden>
          <button type="button" class="addb" id="addT"><i class="nb" id="addB"></i><b>+</b>Add text<small id="addN">adds a new line</small></button></div>
        <label>4 · Size</label><div class="sizes" id="sizes"></div>
        <label>Quantity</label><input type="number" id="qty" min="1" max="20" value="1">
        <div class="price" id="price"></div>
        <label>5 · Delivery details</label>
        <input id="nm" placeholder="Full name"><div style="height:8px"></div>
        <input id="ph" placeholder="Phone number"><div style="height:8px"></div>
        <textarea id="ad" rows="2" placeholder="Address"></textarea>
        <div style="height:16px"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn g" id="addCart" disabled>Add to cart</button><button class="btn" id="place" disabled>Buy now</button></div>
        <p id="msg" style="color:var(--mut);font-size:14px"></p>
      </div>
    </div>
  </section>
  <section id="acctSec" hidden>
    <h2 class="display" id="acctT" style="font-size:40px">Your cart</h2>
    <div class="chips" style="margin-bottom:18px"><a class="chip" href="#cart" id="tabC">Cart</a><a class="chip" href="#orders" id="tabO">My orders</a></div>
    <div id="acctBody"></div>
  </section>
</main>
<footer>© ManiacPrints · Custom printed tees</footer>

</div></div>

  }else{$('feat').innerHTML='';$('pg').innerHTML='';$('pick').innerHTML='';S.pid=null;S.base=null;draw()}
  var row=function(x,t){return '<div style="display:flex;align-items:center;gap:12px;margin:8px 0"><img src="'+x.img+'" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:6px"><span style="flex:1">'+t+'</span><button class="btn sm" data-del="'+x.id+'">Delete</button></div>'},em=function(t){return '<span style="color:var(--mut);font-size:14px">'+t+'</span>'};
  var pl=$('pl'),gl=$('gl');
  if(pl)pl.innerHTML=P.length?P.map(function(x){return row(x,esc(x.name)+(x.colour?' · '+esc(x.colour):'')+' · ₹'+esc(x.price))}).join(''):em('No products yet. Upload one above.');
  if(gl)gl.innerHTML=G.length?G.map(function(x){return row(x,esc(x.name||'Untitled photo')+(x.sub?' · '+esc(x.sub):''))}).join(''):em('No banner photos yet. Upload some above.');
  if(window._draw)window._draw();
}
$('hPrev').onclick=function(){go(cur-1);auto()};$('hNext').onclick=function(){go(cur+1);auto()};
$('cPrev').onclick=function(){$('feat').scrollBy({left:-$('feat').clientWidth*.8,behavior:'smooth'})};
$('cNext').onclick=function(){$('feat').scrollBy({left:$('feat').clientWidth*.8,behavior:'smooth'})};
$('q').oninput=function(){Qs=this.value.trim();if(VIEW!=='home'){location.hash='#products';return}if(P.length){renderGrid();if(Qs)$('products').scrollIntoView({behavior:'smooth'})}};
document.addEventListener('click',function(e){var c=e.target.closest&&e.target.closest('[data-f]');if(c){F=c.dataset.f;renderGrid()}});
function subProducts(){
  if(!db)return;
  db.collection('products').orderBy('ts','desc').onSnapshot(function(s){var A=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});H=A.filter(function(x){return x.kind==='hero'});P=A.filter(function(x){return x.kind!=='gallery'&&x.kind!=='hero'});G=A.filter(function(x){return x.kind!=='product'&&x.kind!=='hero'});renderProducts()},function(){});
}
renderProducts();

/* controls */
$('sizes').innerHTML=['S','M','L','XL','XXL'].map(function(s){return '<b data-s="'+s+'">'+s+'</b>'}).join('');
function sync(){
  [].forEach.call($('sizes').children,function(e){e.classList.toggle('on',e.dataset.s===S.size)});
  draw();
}
$('sizes').onclick=function(e){if(e.target.dataset.s){S.size=e.target.dataset.s;sync()}};
['qty'].forEach(function(i){$(i).oninput=draw});

/* PNG upload: downscale so the order stays small */
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;
  if(f.type!=='image/png'){toast('Please choose a PNG file');this.value='';return}
  var im=new Image(),u=URL.createObjectURL(f);
  im.onload=function(){
    var m=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas'),d,k=0;
    do{c.width=Math.max(1,Math.round(im.width*m));c.height=Math.max(1,Math.round(im.height*m));var g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/png');m*=.8}while(d.length>450000&&k++<5);
    var b=new Image();b.onload=function(){S.bimg=b;S.img=d;sel='i';chips();editor();draw();setTimeout(function(){goTo($('stepText'))},350)};b.src=d;URL.revokeObjectURL(u)};
  im.src=u};

/* orders (shared database) */
var db=null,unsub=null;
claude.use('db').then(function(d){db=d;subProducts()}).catch(function(){});
/* ===== Login, cart and my orders (Firebase Auth + Firestore) ===== */
var USER=null,PROF={},CART=[],MYO=[],uCart=null,uOrd=null,AMODE='in';
var DIRN=['Horizontal','Vertical (turned)','Vertical (stacked)'];
function money(n){return '₹'+(+n||0).toLocaleString('en-IN')}
function aerr(e){var c=(e&&e.code)||'',m={'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with this email.','auth/email-already-in-use':'This email already has an account. Log in instead.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'That email does not look right.','auth/too-many-requests':'Too many tries. Wait a minute and try again.','auth/network-request-failed':'No internet connection.','auth/popup-closed-by-user':'Google sign-in was closed.','auth/operation-not-allowed':'This sign-in method is not turned on in Firebase yet.','auth/unauthorized-domain':'Add this website address in Firebase > Authentication > Settings > Authorized domains.'};return m[c]||(e&&e.message)||'Something went wrong.'}

/* ---- login window ---- */
function setMode(m){AMODE=m;$('authT').textContent=m==='up'?'Create account':'Log in';$('nmW').hidden=m!=='up';$('aGo').textContent=m==='up'?'Create account':'Log in';$('aSw').textContent=m==='up'?'Have an account? Log in':'New here? Create an account';$('ap').autocomplete=m==='up'?'new-password':'current-password'}
function openAuth(msg){setMode('in');$('authS').textContent=msg||'';$('aMsg').textContent='';$('authM').hidden=false;setTimeout(function(){$('ae').focus()},50)}
function closeAuth(){$('authM').hidden=true}
function needLogin(msg){if(USER)return false;openAuth(msg);return true}
$('authX').onclick=closeAuth;$('authM').onclick=function(e){if(e.target===this)closeAuth()};
$('aSw').onclick=function(){setMode(AMODE==='up'?'in':'up')};
$('aGo').onclick=async function(){
  var em=$('ae').value.trim(),pw=$('ap').value,nm=$('an').value.trim(),b=this,m=$('aMsg');
  if(!em||!pw){m.textContent='Enter your email and password.';return}
  if(AMODE==='up'&&!nm){m.textContent='Enter your name.';return}
  b.disabled=true;m.textContent='';
  try{
    if(AMODE==='up'){var c=await AUTH.createUserWithEmailAndPassword(em,pw);await c.user.updateProfile({displayName:nm});await FS.collection('users').doc(c.user.uid).set({name:nm,email:em,created:Date.now()},{merge:true});PROF.name=nm}
    else await AUTH.signInWithEmailAndPassword(em,pw);
    closeAuth();toast('Welcome!');
  }catch(e){m.textContent=aerr(e)}
  b.disabled=false};
$('aG').onclick=async function(){try{await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider());closeAuth();toast('Welcome!')}catch(e){$('aMsg').textContent=aerr(e)}};
$('aFg').onclick=async function(){var em=$('ae').value.trim();if(!em){$('aMsg').textContent='Type your email above first.';return}try{await AUTH.sendPasswordResetEmail(em);$('aMsg').textContent='Password reset email sent. Check your inbox.'}catch(e){$('aMsg').textContent=aerr(e)}};
$('authBtn').onclick=function(){if(USER)AUTH.signOut().then(function(){toast('Logged out');if(VIEW==='acct')location.hash=''});else openAuth()};
function bar(){$('cartN').textContent=CART.length;$('cartN').hidden=!CART.length;$('authBtn').textContent=USER?'Log out':'Log in';$('authBtn').title=USER?(USER.email||''):''}
function fillDelivery(){if(!USER)return;var n=$('nm'),p=$('ph'),a=$('ad');if(n&&!n.value)n.value=PROF.name||USER.displayName||'';if(p&&!p.value)p.value=PROF.phone||'';if(a&&!a.value)a.value=PROF.address||''}

AUTH.onAuthStateChanged(function(u){
  USER=u;if(uCart){uCart();uCart=null}if(uOrd){uOrd();uOrd=null}CART=[];MYO=[];PROF={};
  if(u){
    FS.collection('users').doc(u.uid).get().then(function(d){PROF=d.exists?d.data():{};fillDelivery();if(VIEW==='acct')renderAcct()}).catch(function(){});
    uCart=FS.collection('users').doc(u.uid).collection('cart').onSnapshot(function(s){CART=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return b.ts-a.ts});bar();if(VIEW==='acct')renderAcct()},function(e){toast('Cart error: '+e.message)});
    uOrd=FS.collection('orders').where('uid','==',u.uid).onSnapshot(function(s){MYO=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return b.ts-a.ts});if(VIEW==='acct')renderAcct()},function(e){toast('Orders error: '+e.message)});
  }
  bar();if(VIEW==='acct')renderAcct()});

/* ---- everything about the design that gets saved with the cart item / order ---- */
function designData(){
  var tx=T.filter(function(t){return t.txt.trim()}).map(function(t){return{raw:t.raw==null?t.txt:t.raw,txt:t.txt,lang:LANG,langName:LANGS[LANG],font:FONTS[t.font][0],color:colOf(t),size:t.size,x:Math.round(t.px),y:Math.round(t.py),direction:DIRN[t.o||0],front:!!t.front}});
  return{shirt:SHIRT,lang:LANG,langName:LANGS[LANG],textCount:tx.length,texts:tx,hasPicture:!!S.bimg,picture:S.bimg?{size:Math.round(I.size),x:Math.round(I.px),y:Math.round(I.py)}:null}}
function printSafe(max){var K=2,d;do{d=printFile(K);K-=.4}while(d.length>max&&K>.7);return d}
function buildItem(){
  var q=Math.max(1,Math.min(20,Math.floor(+$('qty').value)||1)),u=Math.floor(S.price||PRICE);
  return Object.assign({ts:Date.now(),pid:S.pid,pname:S.pname||'',color:S.pcolor||'',size:S.size,qty:q,unit:u,total:u*q,preview:previewJpg(),design:printSafe(600000)},designData())}
function cartRef(){return FS.collection('users').doc(USER.uid).collection('cart')}
function rid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---- add to cart ---- */
$('addCart').onclick=async function(){
  if(needLogin('Log in to add this design to your cart. Your design stays on this page.'))return;
  if(!S.pid||!layout().n){toast('Add some text or a picture first');return}
  if(CART.length>=8){toast('Cart is full (8 designs). Place an order or remove one.');return}
  var b=this;b.disabled=true;
  try{await cartRef().doc(rid('c_')).set(buildItem());toast('Added to your cart');}
  catch(e){toast('Could not add to cart: '+(e.message||e.code))}
  draw()};

/* ---- place order(s): one order per design, design image saved with it ---- */
async function placeOrders(items,dl,fromCart){
  var batch=FS.batch(),gid=rid('g_');
  items.forEach(function(it){
    var pr=P.filter(function(q){return q.id===it.pid})[0];
    if(!pr)throw new Error('"'+(it.pname||'A product')+'" is no longer available. Remove it from your cart.');
    var d=Object.assign({},it),png=d.design,id=rid('o_'),u=Math.floor(+pr.price)||PRICE;
    delete d.design;delete d.id;
    d.unit=u;d.total=u*d.qty;
    Object.assign(d,{uid:USER.uid,email:USER.email||'',ts:Date.now(),name:dl.name,phone:dl.phone,address:dl.address,status:'New',groupId:gid});
    batch.set(FS.collection('orders').doc(id),d);
    batch.set(FS.collection('orders').doc(id).collection('files').doc('design'),{png:png,ts:d.ts});
    if(fromCart)batch.delete(cartRef().doc(it.id))});
  batch.set(FS.collection('users').doc(USER.uid),{name:dl.name,phone:dl.phone,address:dl.address,email:USER.email||'',updated:Date.now()},{merge:true});
  await batch.commit();PROF.name=dl.name;PROF.phone=dl.phone;PROF.address=dl.address}

/* ---- buy now ---- */
$('place').onclick=async function(){
  var nm=$('nm').value.trim(),ph=$('ph').value.trim(),ad=$('ad').value.trim();
  if(!nm||!ph||!ad){$('msg').textContent='Please fill in name, phone and address.';return}
  if(needLogin('Log in to place your order. Your design stays on this page.'))return;
  var b=this;b.disabled=true;$('msg').textContent='Saving your design and placing the order…';
  try{await placeOrders([buildItem()],{name:nm,phone:ph,address:ad},false);$('msg').textContent='';toast('Order placed! Thank you, '+nm);location.hash='#orders'}
  catch(e){$('msg').textContent='Could not place order: '+(e.message||e.code)}
  draw()};

/* ---- cart + my orders pages ---- */
function tlines(x){var t=x.texts||[],n=x.textCount!=null?x.textCount:t.length,ln=x.langName||LANGS[x.lang]||'English';
  return '<b>'+n+' text'+(n===1?'':'s')+'</b> · prints in '+esc(ln)+(x.hasPicture?' · + 1 picture':'')+
  t.map(function(y,k){return '<br>Text '+(k+1)+': typed “'+esc(y.raw)+'”'+(y.raw!==y.txt?' → printed <b>'+esc(y.txt)+'</b>':'')}).join('')}
function cartHtml(){
  if(!CART.length)return '<div class="note">Your cart is empty. <a href="#custom" style="color:var(--fg)">Design a tee</a></div>';
  var tot=0,h=CART.map(function(x){tot+=x.total||0;return '<div class="ci"><img src="'+x.preview+'" alt=""><div class="m"><b>'+esc(x.pname||'Tee')+'</b> '+esc(x.color||'')+' · '+esc(x.shirt)+' tee · size '+esc(x.size)+'<br>'+tlines(x)+'<br>Qty <input type="number" min="1" max="20" value="'+x.qty+'" data-q="'+x.id+'" style="width:72px;padding:6px;display:inline-block"> · <b>'+money(x.total)+'</b><br><button class="btn sm g" data-rm="'+x.id+'" style="margin-top:8px">Remove</button></div></div>'}).join('');
  return h+'<div class="note"><b>Delivery details</b><div style="height:8px"></div><input id="cn" placeholder="Full name" value="'+esc(PROF.name||USER.displayName||'')+'"><div style="height:8px"></div><input id="cp" placeholder="Phone number" value="'+esc(PROF.phone||'')+'"><div style="height:8px"></div><textarea id="ca" rows="2" placeholder="Address">'+esc(PROF.address||'')+'</textarea><div class="price">Total '+money(tot)+'</div><button class="btn" id="co">Place order ('+CART.length+(CART.length===1?' design':' designs')+')</button><p id="cmsg" class="mut" style="font-size:14px"></p></div>'}
function ordersHtml(){
  if(!MYO.length)return '<div class="note">No orders yet. <a href="#custom" style="color:var(--fg)">Design your first tee</a></div>';
  return MYO.map(function(x){return '<div class="ci"><img src="'+(x.preview||'')+'" alt=""><div class="m"><span class="tag">'+esc(x.status||'New')+'</span> '+new Date(x.ts).toLocaleString()+' · #'+esc(x.id.slice(-6).toUpperCase())+'<br><b>'+esc(x.pname||'Tee')+'</b> '+esc(x.color||'')+' · '+esc(x.shirt||'black')+' tee · size '+esc(x.size)+' · ×'+x.qty+' · <b>'+money(x.total)+'</b><br>'+tlines(x)+'<br>Deliver to: '+esc(x.name)+', '+esc(x.phone)+', '+esc(x.address)+'<br><button class="btn sm g" data-dl="'+x.id+'" style="margin-top:8px">Download design PNG</button></div></div>'}).join('')}
function renderAcct(){
  var v=location.hash==='#orders'?'orders':'cart',box=$('acctBody'),a=$('cn');
  if(a){PROF.name=a.value;PROF.phone=$('cp').value;PROF.address=$('ca').value}
  $('acctT').textContent=v==='orders'?'My orders':'Your cart';
  $('tabC').classList.toggle('on',v==='cart');$('tabO').classList.toggle('on',v==='orders');
  if(!USER){box.innerHTML='<div class="note"><b>Please log in</b><p class="mut">Log in to see your cart and your orders. Everything you design is saved to your account.</p><button class="btn" id="ali">Log in / Sign up</button></div>';return}
  box.innerHTML=v==='orders'?ordersHtml():cartHtml()}
async function dlDesign(id,btn){btn.disabled=true;try{var d=await FS.collection('orders').doc(id).collection('files').doc('design').get();if(!d.exists)throw new Error('file not found');var a=document.createElement('a');a.href=d.data().png;a.download='design-'+id+'.png';document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Could not download: '+(e.message||e.code))}btn.disabled=false}
$('acctBody').onclick=function(e){var t=e.target,d=t.dataset||{};
  if(t.id==='ali')openAuth('Log in to see your cart and orders');
  else if(d.rm&&USER)cartRef().doc(d.rm).delete().catch(function(er){toast(er.message)});
  else if(d.dl)dlDesign(d.dl,t);
  else if(t.id==='co')checkout()};
$('acctBody').onchange=function(e){var d=e.target.dataset;if(!d||!d.q||!USER)return;
  var q=Math.max(1,Math.min(20,Math.floor(+e.target.value)||1)),x=CART.filter(function(c){return c.id===d.q})[0];if(!x)return;
  cartRef().doc(d.q).update({qty:q,total:(x.unit||PRICE)*q}).catch(function(er){toast(er.message)})};
async function checkout(){
  var nm=$('cn').value.trim(),ph=$('cp').value.trim(),ad=$('ca').value.trim(),m=$('cmsg'),b=$('co');
  if(!nm||!ph||!ad){m.textContent='Please fill in name, phone and address.';return}
  if(!CART.length)return;
  b.disabled=true;m.textContent='Saving your designs and placing the order…';
  try{await placeOrders(CART.slice(0,8),{name:nm,phone:ph,address:ad},true);toast('Order placed! Thank you, '+nm);location.hash='#orders'}
  catch(e){m.textContent='Could not place order: '+(e.message||e.code);b.disabled=false}}


/* routing */
function route(){
  var h=location.hash;
  VIEW=viewOf(h);
  var hp=hashPid();if(hp&&P.some(function(q){return q.id===hp}))pickP(hp);
  applyView();
  if(VIEW!=='home'){window.scrollTo(0,0);if(VIEW==='acct')renderAcct();if(VIEW==='product'){clearTimeout(SCT);SCT=setTimeout(function(){goTo($('stepPic'))},500)}return}
  var T={'#products':'products','#fresh':'fresh'}[h];
  setTimeout(function(){if(T)$(T).scrollIntoView({behavior:'smooth'});else window.scrollTo(0,0)},50);
}
window.addEventListener('hashchange',route);route();sync();bar();
</script>
